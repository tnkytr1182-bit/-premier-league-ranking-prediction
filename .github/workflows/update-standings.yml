name: Update Premier League Standings

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_standings.mjs'
      - '.github/workflows/update-standings.yml'

permissions:
  contents: write

concurrency:
  group: update-premier-league-standings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest standings
        run: node scripts/update_standings.mjs

      - name: Commit standings when changed
        run: |
          if git diff --quiet -- data/standings.json; then
            echo "No standings change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          git commit -m "chore: update Premier League standings"
          git pull --rebase origin main
          git push origin HEAD:main
